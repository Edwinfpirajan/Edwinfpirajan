name: Actualizar imagenes del perfil

on:
  workflow_dispatch:
  schedule:
    - cron: "23 11 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-assets.yml
      - scripts/generate_profile_cards.py

permissions:
  contents: read

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'Edwinfpirajan/Edwinfpirajan'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      # Solo metadatos publicos. Sin PAT personal, servicios de tarjetas ni paquetes pip.
      # Si falla la consulta, no se sustituyen las tarjetas guardadas por imagenes de error.
      - name: Generar estadisticas y lenguajes publicos
        env:
          PROFILE_USERNAME: Edwinfpirajan
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_profile_cards.py

      - name: Generar animacion de contribuciones
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: Edwinfpirajan
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            profile/contribution-snake.svg?color_snake=%237C3AED
            profile/contribution-snake-dark.svg?palette=github-dark&color_snake=%23A78BFA

      - name: Validar SVGs generados
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          for name in ('stats.svg', 'top-langs.svg', 'contribution-snake.svg', 'contribution-snake-dark.svg'):
              path = Path('profile') / name
              root = ElementTree.parse(path).getroot()
              assert root.tag == '{http://www.w3.org/2000/svg}svg', f'SVG no valido: {path}'
          PY

      - name: Guardar imagenes actualizadas
        env:
          HUSKY: "0"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- profile/stats.svg profile/top-langs.svg profile/contribution-snake.svg profile/contribution-snake-dark.svg
          if git diff --cached --quiet; then
            echo "No hay cambios en las imagenes."
            exit 0
          fi
          git commit -m "chore(profile): refresh public GitHub cards [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
