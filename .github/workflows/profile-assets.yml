name: Actualizar imagenes del perfil

on:
  workflow_dispatch:
  schedule:
    - cron: "23 11 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-assets.yml

permissions:
  contents: read

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'Edwinfpirajan/Edwinfpirajan'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      # Solo se usa el token de este repositorio. No requiere un PAT personal.
      # fail_on_error conserva las imagenes anteriores si GitHub no responde.
      - name: Generar estadisticas
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: username=Edwinfpirajan&show_icons=true&hide_rank=true&locale=es&bg_color=0D1117&title_color=C4B5FD&text_color=C9D1D9&icon_color=A78BFA&border_color=30363D&border_radius=14&disable_animations=true
          path: profile/stats.svg
          core_version: 2.1.3
          fail_on_error: "true"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar tarjeta de lenguajes
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: username=Edwinfpirajan&layout=compact&langs_count=6&locale=es&bg_color=0D1117&title_color=C4B5FD&text_color=C9D1D9&border_color=30363D&border_radius=14&card_width=350&disable_animations=true
          path: profile/top-langs.svg
          core_version: 2.1.3
          fail_on_error: "true"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar animacion de contribuciones
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: Edwinfpirajan
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            profile/contribution-snake.svg?color_snake=%237C3AED
            profile/contribution-snake-dark.svg?palette=github-dark&color_snake=%23A78BFA

      - name: Guardar imagenes actualizadas
        env:
          HUSKY: "0"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- profile/stats.svg profile/top-langs.svg profile/contribution-snake.svg profile/contribution-snake-dark.svg
          if git diff --cached --quiet; then
            echo "No hay cambios en las imagenes."
            exit 0
          fi
          git commit -m "chore(profile): refresh public GitHub cards [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
